openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: departments
    description: Department operations
  - name: employees
    description: Employee operations
  - name: leave-requests
    description: Leave request operations
  - name: sysadmin
    description: System administration operations
  - name: employee-sections
    description: Extended employee record sections (addresses, payroll, attachments, medical, dietary, next of kin, qualifications, work records)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: search
    description: Global permission-aware search
  - name: course-management
    description: Course management operations

paths:
  # ── Storage ───────────────────────────────────────────────────────────────

  /storage/upload-policy:
    get:
      tags: [Storage]
      operationId: getUploadPolicy
      summary: Retrieve the server's active upload limits
      description: |
        Returns `maxFileSizeBytes` and `allowedContentTypes` so the client can
        validate files before uploading. No authentication required.
      responses:
        '200':
          description: Current upload policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadPolicy'

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Auth ─────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /environment:
    get:
      operationId: getEnvironment
      tags: [environment]
      summary: Get deployment environment
      description: >-
        Returns which deployment (development or production) is serving this
        request, driven by the APP_ENV server env var. Public — used to theme
        the UI so DEV/PROD are visually distinguishable, including on the
        pre-login screen, without needing separate builds per environment.
      responses:
        "200":
          description: Deployment environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentStatus"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: departmentIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated department ids; matches employees in any of them
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Employee sections ────────────────────────────────────────────────────

  /employees/{id}/addresses:
    get:
      operationId: listEmployeeAddresses
      tags: [employee-sections]
      summary: List addresses for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeAddress"
    post:
      operationId: createEmployeeAddress
      tags: [employee-sections]
      summary: Add an address to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAddressInput"
      responses:
        "201":
          description: Created address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAddress"

  /employees/{id}/addresses/{addressId}:
    patch:
      operationId: updateEmployeeAddress
      tags: [employee-sections]
      summary: Update an employee address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAddressUpdate"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAddress"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeeAddress
      tags: [employee-sections]
      summary: Delete an employee address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/payroll:
    get:
      operationId: getEmployeePayroll
      tags: [employee-sections]
      summary: Get payroll record for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payroll record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayroll"
        "404":
          description: No payroll record yet
    put:
      operationId: upsertEmployeePayroll
      tags: [employee-sections]
      summary: Create or update payroll record for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePayrollInput"
      responses:
        "200":
          description: Upserted payroll record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayroll"

  /employees/{id}/attachments:
    get:
      operationId: listEmployeeAttachments
      tags: [employee-sections]
      summary: List attachments for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeAttachment"
    post:
      operationId: createEmployeeAttachment
      tags: [employee-sections]
      summary: Add an attachment metadata record to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAttachmentInput"
      responses:
        "201":
          description: Created attachment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAttachment"

  /employees/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteEmployeeAttachment
      tags: [employee-sections]
      summary: Delete an employee attachment record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/medical:
    get:
      operationId: getEmployeeMedical
      tags: [employee-sections]
      summary: Get medical selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Medical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeMedical"
    put:
      operationId: putEmployeeMedical
      tags: [employee-sections]
      summary: Replace medical selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeMedicalInput"
      responses:
        "200":
          description: Updated medical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeMedical"

  /employees/{id}/dietary:
    get:
      operationId: getEmployeeDietary
      tags: [employee-sections]
      summary: Get dietary selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dietary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDietary"
    put:
      operationId: putEmployeeDietary
      tags: [employee-sections]
      summary: Replace dietary selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDietaryInput"
      responses:
        "200":
          description: Updated dietary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDietary"

  /employees/{id}/next-of-kin:
    get:
      operationId: listEmployeeNextOfKin
      tags: [employee-sections]
      summary: List next of kin records for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of next of kin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeNextOfKin"
    post:
      operationId: createEmployeeNextOfKin
      tags: [employee-sections]
      summary: Add a next of kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeNextOfKinInput"
      responses:
        "201":
          description: Created next of kin record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNextOfKin"

  /employees/{id}/next-of-kin/{kinId}:
    patch:
      operationId: updateEmployeeNextOfKin
      tags: [employee-sections]
      summary: Update a next of kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeNextOfKinUpdate"
      responses:
        "200":
          description: Updated next of kin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNextOfKin"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeeNextOfKin
      tags: [employee-sections]
      summary: Delete a next of kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/phones:
    get:
      operationId: listEmployeePhones
      tags: [employee-sections]
      summary: List phone numbers for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of phone numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeePhoneEntry"
    post:
      operationId: createEmployeePhone
      tags: [employee-sections]
      summary: Add a phone number to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePhoneInput"
      responses:
        "201":
          description: Created phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePhoneEntry"

  /employees/{id}/phones/{phoneId}:
    patch:
      operationId: updateEmployeePhone
      tags: [employee-sections]
      summary: Update a phone number
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: phoneId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePhoneUpdate"
      responses:
        "200":
          description: Updated phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePhoneEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeePhone
      tags: [employee-sections]
      summary: Delete a phone number
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: phoneId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/next-of-kin/{kinId}/phones:
    get:
      operationId: listKinPhones
      tags: [employee-sections]
      summary: List phone numbers for a next-of-kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of phone numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KinPhoneEntry"
    post:
      operationId: createKinPhone
      tags: [employee-sections]
      summary: Add a phone number to a next-of-kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePhoneInput"
      responses:
        "201":
          description: Created phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KinPhoneEntry"

  /employees/{id}/next-of-kin/{kinId}/phones/{phoneId}:
    patch:
      operationId: updateKinPhone
      tags: [employee-sections]
      summary: Update a next-of-kin phone number
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
        - name: phoneId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePhoneUpdate"
      responses:
        "200":
          description: Updated phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KinPhoneEntry"
        "404":
          description: Not found
    delete:
      operationId: deleteKinPhone
      tags: [employee-sections]
      summary: Delete a next-of-kin phone number
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
        - name: phoneId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/qualifications:
    get:
      operationId: listEmployeeQualifications
      tags: [employee-sections]
      summary: List qualifications for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of qualifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeQualification"
    post:
      operationId: createEmployeeQualification
      tags: [employee-sections]
      summary: Add a qualification to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeQualificationInput"
      responses:
        "201":
          description: Created qualification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeQualification"

  /employees/{id}/qualifications/{qualId}:
    patch:
      operationId: updateEmployeeQualification
      tags: [employee-sections]
      summary: Update a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeQualificationUpdate"
      responses:
        "200":
          description: Updated qualification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeQualification"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeeQualification
      tags: [employee-sections]
      summary: Delete a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/qualifications/{qualId}/revalidate:
    post:
      operationId: revalidateEmployeeQualification
      tags: [employee-sections]
      summary: Revalidate a qualification (update dates and record history)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationRevalidateInput"
      responses:
        "200":
          description: Updated qualification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeQualification"
        "404":
          description: Not found

  /employees/{id}/qualifications/{qualId}/revalidations:
    get:
      operationId: listQualificationRevalidations
      tags: [employee-sections]
      summary: List revalidation history for a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
