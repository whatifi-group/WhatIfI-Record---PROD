          in: path
          required: true
          schema:
            type: integer
        - name: overwrite
          in: query
          required: false
          schema:
            type: boolean
          description: When true, existing active rates on the target are overwritten with the source rate/unit (dates are preserved)
        - name: effectiveDate
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Effective start date for newly inserted rates (YYYY-MM-DD). Defaults to today. Has no effect on overwritten rates.
      responses:
        "200":
          description: Copy result with created rates and skipped shift types
          content:
