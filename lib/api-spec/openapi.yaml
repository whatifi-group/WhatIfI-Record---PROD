  # ── Search ────────────────────────────────────────────────────────────────

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Global permission-aware search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query (minimum 2 characters)
      responses:
        "200":
          description: Search results grouped by entity type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    SearchResult:
      type: object
      required: [type, id, label, href]
      properties:
        type:
          type: string
          enum: [employee, department, leave_request, user, qualification_type]
        id:
          type: integer
        label:
          type: string
        sublabel:
          type: ["string", "null"]
        href:
          type: string

    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    EmploymentType:
      type: string
      description: Employment type value — managed via List of Values

    EmployeeStatus:
      type: string
      enum: [active, inactive, on_leave, leaver]

    LeaveType:
      type: string
      description: Leave type value — managed via List of Values

    LeaveStatus:
      type: string
      enum: [pending, approved, rejected]

    Department:
      type: object
      required: [id, name, description, headEmployeeId, employeeCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        headEmployeeId:
          type: ["integer", "null"]
        employeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        headEmployeeId:
          type: ["integer", "null"]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        headEmployeeId:
          type: ["integer", "null"]

    Employee:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - jobTitle
        - departmentId
        - departmentName
        - employmentType
        - status
        - startDate
        - salary
        - avatarUrl
        - leaverReason
        - leaverDate
        - createdAt
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        jobTitle:
          type: string
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        leaverReason:
          type: ["string", "null"]
          description: LOV value from leaver_reason category; required when status is leaver
        leaverDate:
          type: ["string", "null"]
          format: date
          description: Date the employee left; defaults to today when status is set to leaver
        createdAt:
          type: string
          format: date-time

    EmployeeInput:
      type: object
      required: [firstName, lastName, email, jobTitle, employmentType, status, startDate, userRole, temporaryPassword]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
        jobTitle:
          type: string
          minLength: 1
        departmentId:
          type: ["integer", "null"]
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        userRole:
          type: integer
          description: Role ID to assign to the automatically created user account
        temporaryPassword:
          type: string
          minLength: 8
          description: Temporary password for the automatically created user account

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        jobTitle:
          type: string
          minLength: 1
        departmentId:
          type: ["integer", "null"]
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        leaverReason:
          type: ["string", "null"]
          description: Required when setting status to leaver
        leaverDate:
          type: ["string", "null"]
          format: date
          description: Defaults to today if omitted when setting status to leaver

    LeaveRequest:
      type: object
      required:
        - id
        - employeeId
        - employeeName
        - type
        - startDate
        - endDate
        - status
        - reason
        - createdAt
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveStatus"
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LeaveRequestInput:
      type: object
      required: [employeeId, type, startDate, endDate]
      properties:
        employeeId:
          type: integer
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string

    LeaveRequestUpdate:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveStatus"
        reason:
          type: ["string", "null"]

    # ── LOV schemas ─────────────────────────────────────────────────────────

    LovItem:
      type: object
      required: [id, category, value, label, sortOrder, isActive, isSystem, createdAt]
      properties:
        id:
          type: integer
        category:
          type: string
        value:
          type: string
        label:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LovItemInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        sortOrder:
          type: integer
        isActive:
          type: boolean

    LovItemUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        sortOrder:
          type: integer
        isActive:
          type: boolean

    LovCategory:
      type: object
      required: [category, label, items]
      properties:
        category:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LovItem"

    # ── Auth schemas ────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    # ── SysAdmin schemas ────────────────────────────────────────────────────

    Permission:
      type: string
      enum:
        - sysadmin
        - hr:access
        - hr:past_employees
        - hr_admin
        - view_employees
        - edit_employees
        - delete_employees
        - view_departments
        - edit_departments
        - view_leave
        - manage_leave
        - view_reports
        - view_payroll

    UserStatus:
      type: string
      enum: [active, inactive, suspended]

    Role:
      type: object
      required: [id, name, description, permissions, isSystem, userCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        isSystem:
          type: boolean
        userCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
