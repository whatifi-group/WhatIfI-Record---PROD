                $ref: "#/components/schemas/Role"
        "404":
          description: Not found
    patch:
      operationId: updateRole
      tags: [sysadmin]
      summary: Update a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Not found
    delete:
      operationId: deleteRole
      tags: [sysadmin]
      summary: Delete a role (must not be a system role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Cannot delete system role or role in use

  /sysadmin/users:
    get:
      operationId: listUsers
      tags: [sysadmin]
      summary: List all users
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: roleIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated role ids; matches users holding any of them
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [sysadmin]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered

  /sysadmin/users/{id}:
    get:
      operationId: getUser
      tags: [sysadmin]
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [sysadmin]
      summary: Update a user (role, permissions, status, name)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [sysadmin]
      summary: Delete a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sysadmin/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [sysadmin]
      summary: Reset a user's password directly (sysadmin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordInput"
      responses:
        "204":
          description: Password updated
        "400":
          description: Validation error
        "404":
          description: Not found

  /sysadmin/audit-log:
    get:
      operationId: listAuditLog
      tags: [sysadmin]
      summary: List system audit trail entries, most recent first
      parameters:
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: ISO timestamp — only entries at or after this time
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO timestamp — only entries at or before this time
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Page of audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /sysadmin/summary:
    get:
      operationId: getSysadminSummary
      tags: [sysadmin]
      summary: Get sysadmin dashboard summary counts
      responses:
        "200":
          description: Sysadmin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SysadminSummary"

  /sysadmin/qualification-types:
    get:
      operationId: listQualificationTypes
      tags: [sysadmin]
      summary: List all qualification types ordered alphabetically
      responses:
        "200":
          description: List of qualification types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualificationType"
    post:
      operationId: createQualificationType
      tags: [sysadmin]
      summary: Create a qualification type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationTypeInput"
      responses:
        "201":
          description: Created qualification type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationType"

  /sysadmin/qualification-types/import:
    post:
      operationId: importQualificationTypes
      tags: [sysadmin]
      summary: Bulk-import qualification types from a CSV file
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationTypeImportResult"
        "400":
          description: Parse error or empty file

  /sysadmin/qualification-types/{id}:
    patch:
      operationId: updateQualificationType
      tags: [sysadmin]
      summary: Update a qualification type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationTypeUpdate"
      responses:
        "200":
          description: Updated qualification type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationType"
        "404":
          description: Not found
    delete:
      operationId: deleteQualificationType
      tags: [sysadmin]
      summary: Delete a qualification type
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Course management ────────────────────────────────────────────────────

  /course-management/students:
    get:
      operationId: listStudents
      tags: [course-management]
      summary: List all registered students
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [course-management]
      summary: Register a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /course-management/students/{studentId}:
    get:
      operationId: getStudent
      tags: [course-management]
      summary: Get a registered student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
    patch:
      operationId: updateStudent
      tags: [course-management]
      summary: Update a registered student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found

  # ── Audit trail (view-duration reporting) ───────────────────────────────

  /audit-log/view-duration:
    post:
      operationId: reportViewDuration
      tags: [audit-log]
      summary: >-
        Record how long a record detail page (Employee Profile, LOV category
        detail, an onboarding submission, ...) stayed open. Sent via
        navigator.sendBeacon when the page unmounts. Available to any
        authenticated user — not gated behind the sysadmin permission, since
        any user who could view the record may report having viewed it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewDurationReport"
      responses:
        "204":
          description: Recorded
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Search ────────────────────────────────────────────────────────────────

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Global permission-aware search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query (minimum 2 characters)
      responses:
        "200":
          description: Search results grouped by entity type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    SearchResult:
      type: object
      required: [type, id, label, href]
      properties:
        type:
          type: string
          enum: [employee, department, leave_request, user, qualification_type]
        id:
          type: integer
        label:
          type: string
        sublabel:
          type: ["string", "null"]
        href:
          type: string

    SearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    EnvironmentStatus:
      type: object
      properties:
        environment:
          type: string
          enum: [development, production]
      required:
        - environment

    EmploymentType:
      type: string
      description: Employment type value — managed via List of Values

    EmployeeStatus:
      type: string
      enum: [active, inactive, on_leave, leaver]

    LeaveType:
      type: string
      description: Leave type value — managed via List of Values

    LeaveStatus:
      type: string
      description: Leave request status value — managed via List of Values

    Department:
      type: object
      required: [id, name, description, headEmployeeId, employeeCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        headEmployeeId:
          type: ["integer", "null"]
        employeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        headEmployeeId:
          type: ["integer", "null"]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        headEmployeeId:
          type: ["integer", "null"]

    Employee:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - jobTitle
        - departments
        - employmentType
        - status
        - startDate
        - salary
        - avatarUrl
        - leaverReason
        - leaverDate
        - createdAt
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phones:
          type: array
          items:
            $ref: "#/components/schemas/PhoneSummary"
          description: Phone numbers for this employee (only present on single-record responses)
        jobTitle:
          type: string
        departments:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentSummary"
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        leaverReason:
          type: ["string", "null"]
          description: LOV value from leaver_reason category; required when status is leaver
        leaverDate:
          type: ["string", "null"]
          format: date
          description: Date the employee left; defaults to today when status is set to leaver
        createdAt:
          type: string
          format: date-time
        pendingDisclosureReview:
          type: boolean
          description: >
            True when the employee has at least one disclosure with conviction details
            that has not yet been signed off. Only populated for users with
            view_disclosures or sysadmin permission; false otherwise.

    EmployeeInput:
      type: object
      required: [firstName, lastName, email, jobTitle, employmentType, status, startDate, userRoleIds, temporaryPassword]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        jobTitle:
          type: string
          minLength: 1
        departmentIds:
          type: array
          items:
            type: integer
          default: []
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        userRoleIds:
          type: array
          items:
            type: integer
          minItems: 1
          description: Role IDs to assign to the automatically created user account
        temporaryPassword:
          type: string
          minLength: 8
          description: Temporary password for the automatically created user account

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        jobTitle:
          type: string
          minLength: 1
        departmentIds:
          type: array
          items:
            type: integer
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        leaverReason:
          type: ["string", "null"]
          description: Required when setting status to leaver
        leaverDate:
          type: ["string", "null"]
          format: date
          description: Defaults to today if omitted when setting status to leaver

    LeaveRequest:
      type: object
      required:
        - id
        - employeeId
        - employeeName
        - type
        - startDate
        - endDate
        - status
        - reason
        - createdAt
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveStatus"
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LeaveRequestInput:
      type: object
      required: [employeeId, type, startDate, endDate]
      properties:
        employeeId:
          type: integer
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string

    LeaveRequestUpdate:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveStatus"
        reason:
          type: ["string", "null"]

    # ── LOV schemas ─────────────────────────────────────────────────────────

    LovItem:
      type: object
      required: [id, category, value, label, sortOrder, isActive, isSystem, createdAt]
      properties:
        id:
          type: integer
        category:
          type: string
        value:
          type: string
        label:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LovItemInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        sortOrder:
          type: integer
        isActive:
          type: boolean

    LovItemUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        sortOrder:
          type: integer
        isActive:
          type: boolean

    LovCategory:
      type: object
      required: [category, label, items]
      properties:
        category:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LovItem"

    # ── Auth schemas ────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    # ── SysAdmin schemas ────────────────────────────────────────────────────

    Permission:
      type: string
      enum:
        - sysadmin
        - hr:access
        - hr:past_employees
        - hr_admin
        - view_employees
        - edit_employees
        - delete_employees
        - view_departments
        - edit_departments
        - view_leave
        - manage_leave
        - view_reports
        - view_payroll
        - view_disclosures
        - review_disclosures
        - view_own_profile
        - upload_qualifications
        - view_employee_directory

    UserStatus:
      type: string
      description: User account status value — managed via List of Values

    Role:
      type: object
      required: [id, name, description, permissions, isSystem, userCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        isSystem:
          type: boolean
        userCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    UserLinkedEmployee:
      type: object
      required: [id, firstName, lastName, status]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: "#/components/schemas/EmployeeStatus"

    RoleSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    DepartmentSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    User:
      type: object
      required: [id, name, email, status, roles, permissions, isSystemAccount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleSummary"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        isSystemAccount:
          type: boolean
        employeeId:
          type: ["integer", "null"]
        employee:
          oneOf:
            - $ref: "#/components/schemas/UserLinkedEmployee"
            - type: "null"
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password, roleIds]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        roleIds:
          type: array
          items:
            type: integer
          minItems: 1
        isSystemAccount:
          type: boolean
          default: true
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          default: []

    ResetUserPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 8

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/UserStatus"
        roleIds:
          type: array
          items:
            type: integer
          minItems: 1
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    SysadminSummary:
      type: object
      required: [totalUsers, activeUsers, totalRoles, recentUsers]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        suspendedUsers:
          type: integer
        totalRoles:
          type: integer
        recentUsers:
          type: array
          items:
            $ref: "#/components/schemas/User"

    AuditLogEntry:
      type: object
      required: [id, timestamp, module, action, userId, userName, method, path, statusCode]
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
          description: When the action occurred, in GMT/UTC.
        module:
          type: string
          description: The system module the request belongs to, e.g. "sysadmin", "hr".
        action:
          type: string
          maxLength: 5000
          description: >-
            Detailed, human-readable description of what was done or viewed —
            includes the specific record id, query filters, and a redacted
            summary of the submitted data where applicable, e.g.
            'Updated role 12 (data: {"permissions":["sysadmin"]})'.
            Capped at 5000 characters.
        userId:
          type: ["integer", "null"]
        userName:
          type: ["string", "null"]
          description: Snapshot of the acting user's name at the time of the action.
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
        ipAddress:
          type: ["string", "null"]
        durationMs:
          type: ["integer", "null"]
          description: >-
            Set only for client-reported "record view" events (method
            "VIEW") — how long the record detail page stayed open.

    ViewDurationReport:
      type: object
      required: [module, path, durationMs]
      properties:
        module:
          type: string
          description: The module the viewed record belongs to, e.g. "hr", "sysadmin".
        path:
          type: string
          description: The record's page path, e.g. "/employees/2585".
        durationMs:
          type: integer
          minimum: 0
        recordLabel:
          type: ["string", "null"]
          description: >-
