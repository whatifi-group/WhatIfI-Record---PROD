  /work-records:
    get:
      operationId: listWorkRecords
      tags: [employee-sections]
      summary: List work records across all employees in a single call
      description: |
        Aggregation endpoint that returns work records joined with employee
        data so the caller avoids fanning out one request per employee.
        All parameters are optional — omitting them returns all records.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive lower bound on shiftDate (YYYY-MM-DD)
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Inclusive upper bound on shiftDate (YYYY-MM-DD)
        - name: shiftType
          in: query
          required: false
          schema:
            type: string
          description: Filter to a specific shift type value
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
          description: Filter to a specific department
        - name: employeeStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
          description: Filter to employees with this status (omit for all statuses)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Full-name or email substring search across employees
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 1-based page number
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Number of records per page (max 200)
      responses:
