name: API Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run API tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://testuser:testpassword@localhost:5432/testdb' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests talk to a real database, but the postgres service starts
      # empty and nothing else creates the schema — the app only migrates at
      # boot, which the tests never do. Without this every DB-backed test
      # fails with `relation "employees" does not exist`.
      # Uses the same runner as scripts/post-merge.sh: applies each SQL file
      # in order and stamps the journal, never dropping anything.
      - name: Apply database migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Run tests
        run: pnpm test
