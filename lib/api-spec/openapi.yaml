openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: departments
    description: Department operations
  - name: employees
    description: Employee operations
  - name: leave-requests
    description: Leave request operations
  - name: sysadmin
    description: System administration operations
  - name: employee-sections
    description: Extended employee record sections (addresses, payroll, attachments, medical, dietary, next of kin, qualifications, work records)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: search
    description: Global permission-aware search

paths:
  # ── Storage ───────────────────────────────────────────────────────────────

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Auth ─────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ── Employee sections ────────────────────────────────────────────────────

  /employees/{id}/addresses:
    get:
      operationId: listEmployeeAddresses
      tags: [employee-sections]
      summary: List addresses for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeAddress"
    post:
      operationId: createEmployeeAddress
      tags: [employee-sections]
      summary: Add an address to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAddressInput"
      responses:
        "201":
          description: Created address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAddress"

  /employees/{id}/addresses/{addressId}:
    patch:
      operationId: updateEmployeeAddress
      tags: [employee-sections]
      summary: Update an employee address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAddressUpdate"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAddress"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeeAddress
      tags: [employee-sections]
      summary: Delete an employee address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/payroll:
    get:
      operationId: getEmployeePayroll
      tags: [employee-sections]
      summary: Get payroll record for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payroll record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayroll"
        "404":
          description: No payroll record yet
    put:
      operationId: upsertEmployeePayroll
      tags: [employee-sections]
      summary: Create or update payroll record for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePayrollInput"
      responses:
        "200":
          description: Upserted payroll record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayroll"

  /employees/{id}/attachments:
    get:
      operationId: listEmployeeAttachments
      tags: [employee-sections]
      summary: List attachments for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeAttachment"
    post:
      operationId: createEmployeeAttachment
      tags: [employee-sections]
      summary: Add an attachment metadata record to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeAttachmentInput"
      responses:
        "201":
          description: Created attachment record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeAttachment"

  /employees/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteEmployeeAttachment
      tags: [employee-sections]
      summary: Delete an employee attachment record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/medical:
    get:
      operationId: getEmployeeMedical
      tags: [employee-sections]
      summary: Get medical selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Medical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeMedical"
    put:
      operationId: putEmployeeMedical
      tags: [employee-sections]
      summary: Replace medical selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeMedicalInput"
      responses:
        "200":
          description: Updated medical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeMedical"

  /employees/{id}/dietary:
    get:
      operationId: getEmployeeDietary
      tags: [employee-sections]
      summary: Get dietary selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dietary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDietary"
    put:
      operationId: putEmployeeDietary
      tags: [employee-sections]
      summary: Replace dietary selections and notes for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeDietaryInput"
      responses:
        "200":
          description: Updated dietary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDietary"

  /employees/{id}/next-of-kin:
    get:
      operationId: listEmployeeNextOfKin
      tags: [employee-sections]
      summary: List next of kin records for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of next of kin
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeNextOfKin"
    post:
      operationId: createEmployeeNextOfKin
      tags: [employee-sections]
      summary: Add a next of kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeNextOfKinInput"
      responses:
        "201":
          description: Created next of kin record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNextOfKin"

  /employees/{id}/next-of-kin/{kinId}:
    patch:
      operationId: updateEmployeeNextOfKin
      tags: [employee-sections]
      summary: Update a next of kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeNextOfKinUpdate"
      responses:
        "200":
          description: Updated next of kin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeNextOfKin"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeeNextOfKin
      tags: [employee-sections]
      summary: Delete a next of kin record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: kinId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/qualifications:
    get:
      operationId: listEmployeeQualifications
      tags: [employee-sections]
      summary: List qualifications for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of qualifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeQualification"
    post:
      operationId: createEmployeeQualification
      tags: [employee-sections]
      summary: Add a qualification to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeQualificationInput"
      responses:
        "201":
          description: Created qualification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeQualification"

  /employees/{id}/qualifications/{qualId}:
    patch:
      operationId: updateEmployeeQualification
      tags: [employee-sections]
      summary: Update a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeQualificationUpdate"
      responses:
        "200":
          description: Updated qualification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeQualification"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeeQualification
      tags: [employee-sections]
      summary: Delete a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/qualifications/{qualId}/revalidate:
    post:
      operationId: revalidateEmployeeQualification
      tags: [employee-sections]
      summary: Revalidate a qualification (update dates and record history)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationRevalidateInput"
      responses:
        "200":
          description: Updated qualification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeQualification"
        "404":
          description: Not found

  /employees/{id}/qualifications/{qualId}/revalidations:
    get:
      operationId: listQualificationRevalidations
      tags: [employee-sections]
      summary: List revalidation history for a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of revalidation records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualificationRevalidation"

  /employees/{id}/qualifications/{qualId}/certificates:
    get:
      operationId: listQualificationCertificates
      tags: [employee-sections]
      summary: List certificate attachments for a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualificationCertificate"
    post:
      operationId: createQualificationCertificate
      tags: [employee-sections]
      summary: Attach a certificate to a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualificationCertificateInput"
      responses:
        "201":
          description: Created certificate record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationCertificate"

  /employees/{id}/qualifications/{qualId}/certificates/{certId}:
    delete:
      operationId: deleteQualificationCertificate
      tags: [employee-sections]
      summary: Remove a certificate attachment from a qualification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: qualId
          in: path
          required: true
          schema:
            type: integer
        - name: certId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /qualifications/expiring:
    get:
      operationId: listExpiringQualifications
      tags: [employee-sections]
      summary: List expiring or expired qualification records across all employees
      parameters:
        - name: withinDays
          in: query
          required: false
          description: >
            Return qualifications expiring within this many days (including already expired).
            Use 0 to return only already-expired records. Defaults to 30.
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: List of expiring/expired qualification records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpiringQualification"

  /employees/{id}/pay-rates:
    get:
      operationId: listEmployeePayRates
      tags: [employee-sections]
      summary: List pay rates for an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of pay rates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeePayRate"
    post:
      operationId: createEmployeePayRate
      tags: [employee-sections]
      summary: Add a pay rate to an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePayRateInput"
      responses:
        "201":
          description: Created pay rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayRate"

  /employees/{id}/pay-rates/{rateId}:
    put:
      operationId: updateEmployeePayRate
      tags: [employee-sections]
      summary: Update a pay rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: rateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeePayRateInput"
      responses:
        "200":
          description: Updated pay rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeePayRate"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployeePayRate
      tags: [employee-sections]
      summary: Delete a pay rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: rateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees/{id}/pay-rates/copy-from/{sourceId}:
    post:
      operationId: copyEmployeePayRates
      tags: [employee-sections]
      summary: Copy pay rates from a source employee to this employee, skipping shift types that already exist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sourceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Copy result with created rates and skipped shift types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyPayRatesResult"
        "400":
          description: Invalid parameters or cannot copy from self

  /employees/{id}/work-records:
    get:
      operationId: listEmployeeWorkRecords
      tags: [employee-sections]
      summary: List work records (shifts/timesheets) for an employee
      parameters:
        - name: id
          in: path
          required: true
