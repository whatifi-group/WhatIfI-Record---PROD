openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: departments
    description: Department operations
  - name: employees
    description: Employee operations
  - name: leave-requests
    description: Leave request operations
  - name: dashboard
    description: Dashboard summary operations
  - name: sysadmin
    description: System administration operations

paths:
  # ── Auth ─────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployeeStatus"
      responses:
        "200":
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Employee"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /leave-requests:
    get:
      operationId: listLeaveRequests
      tags: [leave-requests]
      summary: List leave requests
      parameters:
        - name: employeeId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeaveStatus"
      responses:
        "200":
          description: List of leave requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaveRequest"
    post:
      operationId: createLeaveRequest
      tags: [leave-requests]
      summary: Create a leave request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestInput"
      responses:
        "201":
          description: Created leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"

  /leave-requests/{id}:
    get:
      operationId: getLeaveRequest
      tags: [leave-requests]
      summary: Get a leave request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Not found
    patch:
      operationId: updateLeaveRequest
      tags: [leave-requests]
      summary: Update a leave request (e.g. approve/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveRequestUpdate"
      responses:
        "200":
          description: Updated leave request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaveRequest"
        "404":
          description: Not found
    delete:
      operationId: deleteLeaveRequest
      tags: [leave-requests]
      summary: Delete a leave request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      description: Aggregate counts and recent activity for the HR dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── List of Values ───────────────────────────────────────────────────────

  /sysadmin/lov:
    get:
      operationId: listLovCategories
      tags: [sysadmin]
      summary: List all LOV categories with their items
      responses:
        "200":
          description: All LOV categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LovCategory"

  /sysadmin/lov/{category}:
    get:
      operationId: listLovItems
      tags: [sysadmin]
      summary: List items for a specific LOV category
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Items in the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LovItem"
    post:
      operationId: createLovItem
      tags: [sysadmin]
      summary: Add a new item to a LOV category
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LovItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LovItem"
        "409":
          description: Value already exists in category

  /sysadmin/lov/{category}/{id}:
    patch:
      operationId: updateLovItem
      tags: [sysadmin]
      summary: Update a LOV item label or sort order
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LovItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LovItem"
        "404":
          description: Not found
    delete:
      operationId: deleteLovItem
      tags: [sysadmin]
      summary: Delete a LOV item (non-system items only)
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Cannot delete a system item

  # ── SysAdmin ──────────────────────────────────────────────────────────────

  /sysadmin/roles:
    get:
      operationId: listRoles
      tags: [sysadmin]
      summary: List all roles
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [sysadmin]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "409":
          description: Role name already exists

  /sysadmin/roles/{id}:
    get:
      operationId: getRole
      tags: [sysadmin]
      summary: Get a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Not found
    patch:
      operationId: updateRole
      tags: [sysadmin]
      summary: Update a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Not found
    delete:
      operationId: deleteRole
      tags: [sysadmin]
      summary: Delete a role (must not be a system role)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Cannot delete system role or role in use

  /sysadmin/users:
    get:
      operationId: listUsers
      tags: [sysadmin]
      summary: List all users
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: roleId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [sysadmin]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Email already registered

  /sysadmin/users/{id}:
    get:
      operationId: getUser
      tags: [sysadmin]
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [sysadmin]
      summary: Update a user (role, permissions, status, name)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [sysadmin]
      summary: Delete a user account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sysadmin/summary:
    get:
      operationId: getSysadminSummary
      tags: [sysadmin]
      summary: Get sysadmin dashboard summary counts
      responses:
        "200":
          description: Sysadmin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SysadminSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    EmploymentType:
      type: string
      description: Employment type value — managed via List of Values

    EmployeeStatus:
      type: string
      enum: [active, inactive, on_leave]

    LeaveType:
      type: string
      description: Leave type value — managed via List of Values

    LeaveStatus:
      type: string
      enum: [pending, approved, rejected]

    Department:
      type: object
      required: [id, name, description, headEmployeeId, employeeCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        headEmployeeId:
          type: ["integer", "null"]
        employeeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        headEmployeeId:
          type: ["integer", "null"]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        headEmployeeId:
          type: ["integer", "null"]

    Employee:
      type: object
      required:
        - id
        - firstName
        - lastName
        - email
        - phone
        - jobTitle
        - departmentId
        - departmentName
        - employmentType
        - status
        - startDate
        - salary
        - avatarUrl
        - createdAt
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        jobTitle:
          type: string
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    EmployeeInput:
      type: object
      required: [firstName, lastName, email, jobTitle, employmentType, status, startDate]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
        jobTitle:
          type: string
          minLength: 1
        departmentId:
          type: ["integer", "null"]
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]

    EmployeeUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: ["string", "null"]
        jobTitle:
          type: string
          minLength: 1
        departmentId:
          type: ["integer", "null"]
        employmentType:
          $ref: "#/components/schemas/EmploymentType"
        status:
          $ref: "#/components/schemas/EmployeeStatus"
        startDate:
          type: string
          format: date
        salary:
          type: ["number", "null"]
        avatarUrl:
          type: ["string", "null"]

    LeaveRequest:
      type: object
      required:
        - id
        - employeeId
        - employeeName
        - type
        - startDate
        - endDate
        - status
        - reason
        - createdAt
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveStatus"
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    LeaveRequestInput:
      type: object
      required: [employeeId, type, startDate, endDate]
      properties:
        employeeId:
          type: integer
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        reason:
          type: string

    LeaveRequestUpdate:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/LeaveType"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/LeaveStatus"
        reason:
          type: ["string", "null"]

    DepartmentHeadcount:
      type: object
      required: [departmentId, departmentName, count]
      properties:
        departmentId:
          type: integer
        departmentName:
          type: string
        count:
          type: integer

    DashboardSummary:
      type: object
      required:
        - totalEmployees
        - activeEmployees
        - onLeaveEmployees
        - totalDepartments
        - pendingLeaveRequests
        - departmentBreakdown
        - recentHires
        - upcomingLeave
      properties:
        totalEmployees:
          type: integer
        activeEmployees:
          type: integer
        onLeaveEmployees:
          type: integer
        totalDepartments:
          type: integer
        pendingLeaveRequests:
          type: integer
        departmentBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentHeadcount"
        recentHires:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        upcomingLeave:
          type: array
          items:
            $ref: "#/components/schemas/LeaveRequest"

    # ── LOV schemas ─────────────────────────────────────────────────────────

    LovItem:
      type: object
      required: [id, category, value, label, sortOrder, isActive, isSystem, createdAt]
      properties:
        id:
          type: integer
        category:
          type: string
        value:
          type: string
        label:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LovItemInput:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          minLength: 1
        value:
          type: string
          minLength: 1
        sortOrder:
          type: integer
        isActive:
          type: boolean

    LovItemUpdate:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        sortOrder:
          type: integer
        isActive:
          type: boolean

    LovCategory:
      type: object
      required: [category, label, items]
      properties:
        category:
          type: string
        label:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LovItem"

    # ── Auth schemas ────────────────────────────────────────────────────────

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    # ── SysAdmin schemas ────────────────────────────────────────────────────

    Permission:
      type: string
      enum:
        - sysadmin
        - hr_admin
        - view_employees
        - edit_employees
        - delete_employees
        - view_departments
        - edit_departments
        - view_leave
        - manage_leave
        - view_reports

    UserStatus:
      type: string
      enum: [active, inactive, suspended]

    Role:
      type: object
      required: [id, name, description, permissions, isSystem, userCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        isSystem:
          type: boolean
        userCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    RoleUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    User:
      type: object
      required: [id, name, email, status, roleId, roleName, permissions, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        roleId:
          type: integer
        roleName:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, password, roleId]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        roleId:
          type: integer
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
          default: []

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/UserStatus"
        roleId:
          type: integer
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    SysadminSummary:
      type: object
      required: [totalUsers, activeUsers, totalRoles, recentUsers]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        suspendedUsers:
          type: integer
        totalRoles:
          type: integer
        recentUsers:
          type: array
          items:
            $ref: "#/components/schemas/User"
