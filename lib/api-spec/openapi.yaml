        recommendation:
          type: string
          description: Disclosure review recommendation value — managed via List of Values
        reviewerNotes:
          type: string
        reviewDate:
          type: string
          format: date

    UploadPolicy:
      type: object
      required: [maxFileSizeBytes, allowedContentTypes]
      properties:
        maxFileSizeBytes:
          type: integer
          description: Maximum permitted upload size in bytes.
        allowedContentTypes:
          type: array
          items:
            type: string
          description: MIME types that the server will accept.
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
